<svg xmlns="http://www.w3.org/2000/svg" width="800" height="110" viewBox="0 0 800 110">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b949e"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#8b949e"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <line x1="150" y1="22" x2="650" y2="22" stroke="#21262d" stroke-width="2" stroke-linecap="round"/>
  <line x1="0" y1="22" x2="70" y2="22" stroke="#58a6ff" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="150 0; 580 0; 150 0" dur="3s" repeatCount="indefinite"/>
  </line>
  <text x="400" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="url(#shine)">Script Kittens © 2026</text>
</svg>
