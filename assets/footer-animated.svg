<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170">
  <defs>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5e8a"/>
      <stop offset="0.125" stop-color="#ff3b30"/>
      <stop offset="0.25" stop-color="#a855f7"/>
      <stop offset="0.375" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#ff5e8a"/>
      <stop offset="0.625" stop-color="#ff3b30"/>
      <stop offset="0.75" stop-color="#a855f7"/>
      <stop offset="0.875" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#ff5e8a"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; -0.5 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur">
        <animate attributeName="stdDeviation" values="3;6;3" dur="2.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M -200 34 Q -150 16 -100 34 T 0 34 T 100 34 T 200 34 T 300 34 T 400 34 T 500 34 T 600 34 T 700 34 T 800 34 T 900 34 T 1000 34" fill="none" stroke="#1f242b" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0; -200 0" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M -200 28 Q -150 8 -100 28 T 0 28 T 100 28 T 200 28 T 300 28 T 400 28 T 500 28 T 600 28 T 700 28 T 800 28 T 900 28 T 1000 28" fill="none" stroke="url(#rgb)" stroke-width="2.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0; -200 0" dur="4s" repeatCount="indefinite"/>
  </path>
  <text x="400" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" filter="url(#glow)">C for Cheat</text>
  <text x="400" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="6" fill="#8b949e">© 2026</text>
</svg>
